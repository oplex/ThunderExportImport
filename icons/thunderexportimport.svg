<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>ThunderExportImport</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- envelope -->
  <rect x="18" y="40" width="72" height="52" rx="8" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M22 46l32 24 32-24" fill="none" stroke="#3a55d8" stroke-opacity="0.5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- export / import arrows -->
  <path d="M100 18v30m-10-10 10 10 10-10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 110V80m-10 10 10-10 10 10" fill="none" stroke="url(#bolt)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lightning bolt -->
  <path d="M60 14 44 44h12l-5 26 22-36H60l8-20z" fill="url(#bolt)" stroke="#7a3d00" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
</svg>
